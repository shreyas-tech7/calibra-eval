[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibra-eval"
version = "0.1.0rc1"
description = "Offline agent evals that also measure how far their own LLM judges can be trusted."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shreyas" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
calibra = "calibra_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/build_examples.py" = ["E501"]  # data table of code strings
